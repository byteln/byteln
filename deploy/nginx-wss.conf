# Example nginx TLS terminator for bytelnd (WSS).
#
# bytelnd listens on plain HTTP/WS (default :8990).
# Clients connect to: wss://byteln.com/bucket/<id>
#
# Adjust server_name, ssl_certificate paths, and upstream address.
# Include from your nginx install, e.g.:
#   include /path/to/byteln/deploy/nginx-wss.conf;

upstream bytelnd {
    server 127.0.0.1:8990;  
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name byteln.com;

    ssl_certificate     /etc/letsencrypt/live/byteln.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byteln.com/privkey.pem;

    # Optional: serve the static web client from the same host.
    # root /var/www/byteln;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    # location = /index.html {
    #     add_header Cache-Control "no-cache";
    # }

    location /health {
        proxy_pass http://bytelnd;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bucket/ {
        proxy_pass http://bytelnd;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WS — do not idle-close active buckets
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
