name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build/publish (e.g. v0.1.0). Leave empty to use the push tag.'
        required: false
        type: string

permissions:
  contents: write

env:
  # All deps are local replaces under server/third_party — never hit the module proxy.
  GOPROXY: off
  GOSUMDB: off
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Test server
        working-directory: server
        run: go test ./internal/...

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web
        working-directory: web
        run: |
          npm ci
          npm run check

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Tag push → build that commit. Manual dispatch → build selected branch tip
      # (so a re-release after a fix does not rebuild the old tag tip).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
            if [ -z "$VERSION" ]; then
              echo "workflow_dispatch requires inputs.tag (e.g. v0.1.0)"
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "$VERSION" in
            v*) ;;
            *) echo "tag must look like v0.1.0, got: $VERSION"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $(git rev-parse --short HEAD)"

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build bytelnd binaries
        working-directory: server
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build() {
            local goos="$1" goarch="$2" ext="${3:-}"
            local out="dist/bytelnd_${VERSION}_${goos}_${goarch}${ext}"
            echo "→ ${out}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "$out" ./cmd/bytelnd
          }

          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64 .exe
          build windows arm64 .exe

          cd dist
          sha256sum bytelnd_* > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Build web static site
        working-directory: web
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PUBLIC_DEFAULT_RELAY: wss://byteln.dev
          PUBLIC_DIRECTORY_URL: https://raw.githubusercontent.com/byteln/byteln/main/directory/servers.json
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p ../server/dist
          tar -C build -czf "../server/dist/byteln-web_${VERSION}.tar.gz" .
          (cd ../server/dist && sha256sum "byteln-web_${VERSION}.tar.gz" >> SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: byteln ${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            server/dist/bytelnd_*
            server/dist/byteln-web_*
            server/dist/SHA256SUMS.txt
          body: |
            ## Artifacts

            | File | Description |
            |---|---|
            | `bytelnd_*` | Static relay binaries (`CGO_ENABLED=0`) |
            | `byteln-web_*.tar.gz` | SvelteKit static web build |
            | `SHA256SUMS.txt` | Checksums |

            ### Quick run

            ```bash
            chmod +x bytelnd_${{ steps.ver.outputs.version }}_linux_amd64
            ./bytelnd_${{ steps.ver.outputs.version }}_linux_amd64
            # listens on :8990 by default (BYTELN_PORT / BYTELN_LISTEN)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
