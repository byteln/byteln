name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - name: Test server
        working-directory: server
        run: go test ./internal/...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web
        working-directory: web
        run: |
          npm ci
          npm run check

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build bytelnd binaries
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build() {
            local goos="$1" goarch="$2" ext="${3:-}"
            local out="dist/bytelnd_${VERSION}_${goos}_${goarch}${ext}"
            echo "→ ${out}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "$out" ./cmd/bytelnd
          }

          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64 .exe
          build windows arm64 .exe

          cd dist
          sha256sum bytelnd_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build web static site
        working-directory: web
        env:
          PUBLIC_DEFAULT_RELAY: wss://byteln.dev
          PUBLIC_DIRECTORY_URL: https://raw.githubusercontent.com/byteln/byteln/main/directory/servers.json
        run: |
          set -euo pipefail
          npm ci
          npm run build
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p ../server/dist
          tar -C build -czf "../server/dist/byteln-web_${VERSION}.tar.gz" .
          (cd ../server/dist && sha256sum "byteln-web_${VERSION}.tar.gz" >> SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: byteln ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            server/dist/bytelnd_*
            server/dist/byteln-web_*
            server/dist/SHA256SUMS.txt
          body: |
            ## Artifacts

            | File | Description |
            |---|---|
            | `bytelnd_*` | Static relay binaries (`CGO_ENABLED=0`) |
            | `byteln-web_*.tar.gz` | SvelteKit static web build |
            | `SHA256SUMS.txt` | Checksums |

            ### Quick run

            ```bash
            chmod +x bytelnd_${{ github.ref_name }}_linux_amd64
            ./bytelnd_${{ github.ref_name }}_linux_amd64
            # listens on :8990 by default (BYTELN_PORT / BYTELN_LISTEN)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
